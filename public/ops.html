<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>饭圈 · 安全控制台</title>
<link rel="icon" href="/assets/mascot.webp">
<link rel="stylesheet" href="/ops.css">
</head>
<body>

<header class="op-top">
  <a class="op-brand" href="/">
    <img src="/assets/mascot.webp" alt="" width="28" height="28">
    <b>饭圈</b><span>安全控制台</span>
  </a>
  <div class="op-pills" id="op-pills">
    <span class="pill" title="最近一分钟有多少次访问"><i>每分钟访问</i><em id="p-rate">–</em></span>
    <span class="pill" title="同时正在处理的请求数，满 200 会开始排队"><i>正在处理</i><em id="p-inflight">–</em></span>
    <span class="pill" title="当前被挡在门外的地址数"><i>已挡住</i><em id="p-blocked">–</em></span>
    <span class="pill" title="数字越大说明服务器越忙，超过 300 会开始变卡"><i>服务器忙不忙</i><em id="p-lag">–</em></span>
  </div>
  <div class="op-actions">
    <span class="op-live" id="op-live"><i></i>实时</span>
    <button class="op-btn ghost" id="op-diag">排错工具</button>
    <a class="op-btn ghost" href="/">回站点</a>
  </div>
</header>

<div class="op-band">
  <b id="op-v-t">正在读取…</b>
  <span id="op-v-s"></span>
  <em class="op-help">这一页就看三件事：谁在访问、谁在可疑地翻、谁该被挡住。可疑度满 60 分系统会自己挡住，一般你只看上面这句话就够了。</em>
</div>

<main class="op-wrap">

  <section class="op-main">

    <div class="op-card">
      <div class="op-head">
        <h2>谁在访问</h2>
        <div class="op-tools">
          <input id="op-q" class="op-input" placeholder="输入一个地址，只看它" autocomplete="off" spellcheck="false">
          <button class="op-btn" id="op-pause">暂停</button>
        </div>
      </div>
      <div class="op-feed-head">
        <span>时间</span><span>来访地址</span><span>在做什么</span><span>看的哪一页</span><span>结果</span><span>耗时</span><span></span>
      </div>
      <div class="op-feed" id="op-feed"></div>
    </div>

    <div class="op-card">
      <div class="op-head">
        <h2>发生过什么</h2>
        <span class="op-sub" id="op-ev-sub">最近 60 条</span>
      </div>
      <div class="op-events" id="op-events"></div>
    </div>

  </section>

  <aside class="op-side">

    <div class="op-card">
      <div class="op-head">
        <h2>可疑的人</h2>
        <span class="op-sub">越靠上越可疑</span>
      </div>
      <div class="op-threats" id="op-threats"></div>
    </div>

    <div class="op-card">
      <div class="op-head">
        <h2>已经挡住的地址</h2>
        <span class="op-sub" id="op-block-sub"></span>
      </div>
      <div class="op-blocks" id="op-blocks"></div>
    </div>

  </aside>

</main>

<div class="op-modal" id="op-modal" hidden>
  <div class="op-modal-box" id="op-modal-box"></div>
</div>

<div class="op-deny" id="op-deny" hidden>
  <b>打不开这个页面</b>
  <p id="op-deny-msg">只有管理员能进安全控制台。</p>
  <a class="op-btn" href="/">回首页</a>
</div>

<script src="/ops.js"></script>
</body>
</html>
