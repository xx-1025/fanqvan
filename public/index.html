<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ff8a3d">
<meta name="description" content="饭圈 · 好好做饭的人都在这里。一个专门聊做菜的美食社区，发帖、关注、点赞、评论，内容经审核后公开。">
<title>饭圈 · 好好做饭的人都在这里</title>
<link rel="icon" href="/assets/mascot.webp">
<link rel="apple-touch-icon" href="/assets/mascot.webp">
<link rel="stylesheet" href="/style.css?v=__FQ_V__">
<!-- 关键路径并行化：app.js 是首屏必下载的大头，预加载让它在 HTML 解析阶段就和 HTML 一起并发下载，
     不再等 HTML 回来后再去请求，慢回源下能省掉一整轮 RTT+排队等待 -->
<link rel="preload" as="script" href="/app.js?v=__FQ_V__">
<style>
/* 启动屏：app.js 到之前先给个东西看，别让用户对着白屏等。
   样式内联在 head，不受 style.css 请求快慢影响；app.js 重绘 #app 时自动消失。 */
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f2f2f2;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#boot .boot-plate{width:76px;height:76px;border-radius:20px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1;animation:fq-bob 1.1s ease-in-out infinite}
#boot .boot-txt{margin:0;color:#939393;font-size:13.5px;font-weight:400;letter-spacing:.3px}
@keyframes fq-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){#boot .boot-plate{animation:none}}
</style>
</head>
<body>
  <div id="app"><div id="boot"><div class="boot-plate">🍳</div><p class="boot-txt">正在装盘…</p></div></div>
  <div id="toast-wrap"></div>
  <script src="/app.js?v=__FQ_V__" fetchpriority="high"></script>
</body>
</html>
